llm:
  provider: "moonshot"
  model: "kimi-k2.5"
  temperature: 0.7

graph:
  name: "mini_harness_v2"
  checkpointer: "sqlite"
  
  # Phase 2: Context & Memory Configuration
  context_engineering:
    token_budget:
      enabled: true
      # 区别二：多维动态触发配置
      trigger:
        or_logic: true  # 任一条件满足即触发
        conditions:
          - type: "token_count"
            threshold: 4000
          - type: "message_count"
            threshold: 20
          - type: "context_fraction"
            threshold: 0.8  # 达到最大上下文 80%
        max_context: 128000  # Kimi 128k 上下文窗口
    
    summarization:
      enabled: true
      keep_recent: 15
      model: "kimi-k2.5"
      # 区别三：摘要伪装为 HumanMessage
      inject_as_human: true
    
    memory:
      enabled: true
      confidence_threshold: 0.8
      max_memories: 3
      storage: "json_file"

  # Phase 3: Skills Configuration
  skills:
    enabled: true
    auto_load:
      - "skills.builtin.save_memory"
    registry: "dynamic"

  nodes:
    # Phase 2: Middleware chain
    - name: "token_budget"
      type: "middleware"
      description: "Monitor token usage and trigger summarization"
      
    - name: "memory_inject"
      type: "middleware"
      description: "Inject relevant memories into context"
      
    - name: "summarize_context"
      type: "conditional"
      description: "Compress old messages when budget exceeded"
      condition: "needs_summarization"
    
    # Phase 1: Core nodes
    - name: "agent"
      type: "agent"
      model: "kimi"
      
    - name: "tool"
      type: "tool"
      require_approval: true
  
  edges:
    # Phase 2: Middleware chain edges
    - from: "__start__"
      to: "token_budget"
      
    - from: "token_budget"
      to: "memory_inject"
      
    - from: "memory_inject"
      to: "summarize_context"
      condition: "needs_summarization"
      
    - from: "memory_inject"
      to: "agent"
      condition: "no_summarization"
      
    - from: "summarize_context"
      to: "agent"
    
    # Phase 1: Core edges
    - from: "agent"
      to: "tool"
      condition: "has_tool_calls"
      
    - from: "agent"
      to: "END"
      condition: "is_complete"
      
    - from: "tool"
      to: "agent"
